name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.11-alpine3.24
        env:
          POSTGRES_USER: ai_artist_test
          POSTGRES_PASSWORD: ai_artist_test
          POSTGRES_DB: ai_artist_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ai_artist_test -d ai_artist_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      AI_ARTIST_DATABASE_URL: postgresql+psycopg://ai_artist_test:ai_artist_test@localhost:5432/ai_artist_test
      AI_ARTIST_TEST_DATABASE_URL: postgresql+psycopg://ai_artist_test:ai_artist_test@localhost:5432/ai_artist_test
    defaults:
      run:
        working-directory: services/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/backend/pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy src
      - run: pytest

  ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
