apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: ai-artist-owned-local-path
provisioner: ai-artist.io/local-path
parameters:
  nodePath: /data/ai-artist/k3s-storage
  pathPattern: "{{ .PVC.Namespace }}/{{ .PVC.Name }}/{{ .PVName }}/"
reclaimPolicy: Retain
volumeBindingMode: WaitForFirstConsumer
