apiVersion: v1
kind: Service
metadata:
  name: website
  namespace: ai-artist
spec:
  selector:
    app.kubernetes.io/name: website
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: website
  namespace: ai-artist
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: website
  template:
    metadata:
      labels:
        app.kubernetes.io/name: website
    spec:
      containers:
        - name: website
          image: ai-artist-ui:m1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: runtime-config
              mountPath: /app/public/app-config.js
              subPath: app-config.js
              readOnly: true
      volumes:
        - name: runtime-config
          configMap:
            name: ai-artist-ui-runtime
---
apiVersion: v1
kind: Service
metadata:
  name: backend-api
  namespace: ai-artist
spec:
  selector:
    app.kubernetes.io/name: backend-api
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-api
  namespace: ai-artist
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: backend-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend-api
    spec:
      initContainers:
        - name: migrate
          image: ai-artist-backend:m1
          imagePullPolicy: IfNotPresent
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - configMapRef:
                name: ai-artist-config
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: ai-artist-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ai-artist-secrets
                  key: POSTGRES_PASSWORD
            - name: AI_ARTIST_DATABASE_URL
              value: postgresql+psycopg://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgresql:5432/ai_artist
            - name: AI_ARTIST_OBJECT_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: ai-artist-secrets
                  key: MINIO_ROOT_USER
            - name: AI_ARTIST_OBJECT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: ai-artist-secrets
                  key: MINIO_ROOT_PASSWORD
      containers:
        - name: api
          image: ai-artist-backend:m1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: ai-artist-config
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: ai-artist-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ai-artist-secrets
                  key: POSTGRES_PASSWORD
            - name: AI_ARTIST_DATABASE_URL
              value: postgresql+psycopg://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgresql:5432/ai_artist
            - name: AI_ARTIST_OBJECT_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: ai-artist-secrets
                  key: MINIO_ROOT_USER
            - name: AI_ARTIST_OBJECT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: ai-artist-secrets
                  key: MINIO_ROOT_PASSWORD
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              memory: 512Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: generation-worker
  namespace: ai-artist
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: generation-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: generation-worker
    spec:
      containers:
        - name: worker
          image: ai-artist-backend:m1
          imagePullPolicy: IfNotPresent
          command: ["ai-artist-worker"]
          envFrom:
            - configMapRef:
                name: ai-artist-config
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: ai-artist-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ai-artist-secrets
                  key: POSTGRES_PASSWORD
            - name: AI_ARTIST_DATABASE_URL
              value: postgresql+psycopg://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgresql:5432/ai_artist
            - name: AI_ARTIST_OBJECT_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: ai-artist-secrets
                  key: MINIO_ROOT_USER
            - name: AI_ARTIST_OBJECT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: ai-artist-secrets
                  key: MINIO_ROOT_PASSWORD
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
